<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - Job Tracker</title>

    <link rel="stylesheet"
          href="/static/css/registration.css">
</head>
<body>

<div class="login-container">

    <div class="login-card">

        <h1>Job Tracker</h1>
        <p>Create your account</p>

        <form action="/register" method="POST">

            <input type="text"
                   name="username"
                   placeholder="Username"
                   required>

            <input type="email"
                   name="email"
                   placeholder="Email"
                   required>

            <input type="password"
                   name="password"
                   placeholder="Password"
                   required>

            <button type="submit">
                Register
            </button>

        </form>

        <p class="login-link">
            Already have an account?
            <a href="/login">Login</a>
        </p>

        <a href="/" class="home-btn">
            ← Back to Home
        </a>

    </div>

</div>

</body>
</html>
